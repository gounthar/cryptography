name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from (pyca uses no v prefix, e.g. 48.0.1)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout only sees tags already mirrored into this fork, so a
      # not-yet-synced upstream tag (or a wrong prefix, e.g. v48.0.1 vs 48.0.1)
      # used to fail at checkout with a cryptic "tag not found". Fetch upstream
      # tags here to close the sync gap, and on a miss print the real available
      # tags so a bad prefix is immediately obvious. Skipped when no tag is
      # given (builds the fork's default branch, as before).
      - name: Resolve and check out release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          UPSTREAM="https://github.com/pyca/cryptography.git"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --tags --force upstream
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "::error::Release tag '${RELEASE_TAG}' not found in fork or upstream (${UPSTREAM})."
            echo "Latest available upstream tags:"
            git tag -l --sort=-v:refname | head -20
            exit 1
          fi
          git checkout -f "refs/tags/${RELEASE_TAG}"
          echo "Building from ${RELEASE_TAG} ($(git rev-parse --short HEAD))"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          # Probe for required headers/tools — only invoke apt when missing.
          # The RISE riscv64 runner image has previously shipped without a
          # functional dpkg state dir, which makes `apt-get install` fail
          # with "Could not open lock file /var/lib/dpkg/lock-frontend".
          missing=()
          dpkg -s libssl-dev   >/dev/null 2>&1 || missing+=(libssl-dev)
          dpkg -s libffi-dev   >/dev/null 2>&1 || missing+=(libffi-dev)
          command -v pkg-config >/dev/null 2>&1 || missing+=(pkg-config)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required system dependencies already present."
            exit 0
          fi
          echo "Missing: ${missing[*]}"
          # Repair dpkg state if the runner image is incomplete.
          if [ ! -e /var/lib/dpkg/lock-frontend ]; then
            sudo mkdir -p /var/lib/dpkg/updates /var/lib/dpkg/info
            sudo touch /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/dpkg/status
          fi
          sudo apt-get update || true
          sudo apt-get install -y "${missing[@]}"

      - name: Setup Rust
        run: |
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v /opt/rust | tr '\n' ':' | sed 's/:$//')
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install cffi into build Python
        run: |
          set -euo pipefail
          # The previous hardcoded path /opt/python-3.12/bin/python3 was specific
          # to an older RISE runner image. Detect the build Python dynamically:
          # prefer the newest /opt/python-* install, fall back to PATH.
          BUILD_PY=""
          for cand in /opt/python-*/bin/python3; do
            [ -x "$cand" ] && BUILD_PY="$cand"
          done
          if [ -z "$BUILD_PY" ]; then
            BUILD_PY=$(command -v python3 || true)
          fi
          if [ -z "$BUILD_PY" ]; then
            echo "No system python3 found; relying on uvx --with cffi --with setuptools at build time."
            exit 0
          fi
          echo "Using build Python: $BUILD_PY ($($BUILD_PY --version))"
          "$BUILD_PY" -m pip install --user cffi setuptools \
            || "$BUILD_PY" -m pip install cffi setuptools \
            || echo "pip install failed; build will rely on uvx-injected cffi/setuptools."

      - name: Build wheel
        run: uvx --python 3.14 --with maturin --with cffi --with setuptools maturin build --release --manylinux off --out /tmp/wheels/ --manifest-path src/rust/Cargo.toml

      - name: Verify platform tag
        run: |
          ls /tmp/wheels/*.whl
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64\|manylinux.*riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl does not have riscv64 platform tag"
              exit 1
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-24.04-riscv
    if: success()
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "whl_path=$WHL" >> "$GITHUB_OUTPUT"
          echo "whl_name=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="riscv64-v${{ steps.wheel_info.outputs.version }}"
          TITLE="riscv64 wheel v${{ steps.wheel_info.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheel.

          Built on: RISE riscv64 runner (ubuntu-24.04-riscv)
          Wheel: ${{ steps.wheel_info.outputs.whl_name }}

          Install:
          \`\`\`
          pip install cryptography --find-links https://github.com/${{ github.repository }}/releases/download/$TAG/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels
