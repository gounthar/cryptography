name: Sync upstream release tags

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:30 UTC, before the riscv64 build cron at 02:00
    - cron: '30 1 * * *'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_tags: ${{ steps.diff.outputs.new_tags }}
      latest_new: ${{ steps.diff.outputs.latest_new }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          # Must be the PAT, not GITHUB_TOKEN. persist-credentials writes this
          # token into http.https://github.com/.extraheader, and that header
          # takes precedence over credentials in the remote URL, so it decides
          # what the tag push below authenticates as.
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Find missing upstream release tags
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM=https://github.com/pyca/cryptography.git

          # Release tags upstream: digits-only (e.g. 47.0.0). Skip rc/dev/alpha.
          git ls-remote --tags --refs "$UPSTREAM" \
            | awk '{print $2}' \
            | sed 's,refs/tags/,,' \
            | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | sort -V > upstream_tags.txt

          git tag -l | sort -V > local_tags.txt
          comm -23 upstream_tags.txt local_tags.txt > new_tags.txt || true

          if [ ! -s new_tags.txt ]; then
            echo "No new upstream tags."
            echo "new_tags=" >> "$GITHUB_OUTPUT"
            echo "latest_new=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New tags to mirror:"
          cat new_tags.txt
          # Use a JSON array for downstream consumption
          mapfile -t TAGS < new_tags.txt
          JSON=$(printf '%s\n' "${TAGS[@]}" | jq -R . | jq -s -c .)
          echo "new_tags=$JSON" >> "$GITHUB_OUTPUT"
          echo "latest_new=${TAGS[-1]}" >> "$GITHUB_OUTPUT"

      - name: Fetch and push new tags to fork
        if: steps.diff.outputs.latest_new != ''
        env:
          # GITHUB_TOKEN cannot be used here. Mirroring an upstream tag carries
          # the upstream tree, including .github/workflows, and GitHub rejects
          # such a push from an App token without the `workflows` permission,
          # which is not grantable in a workflow `permissions:` block. This
          # needs a PAT with `repo` and `workflow` scopes.
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${WORKFLOW_TOKEN}@github.com/${{ github.repository }}"
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Mirroring $TAG"
            git fetch https://github.com/pyca/cryptography.git \
              "refs/tags/$TAG:refs/tags/$TAG"
            git push origin "refs/tags/$TAG"
          done < new_tags.txt

      - name: Update main from upstream
        if: steps.diff.outputs.latest_new != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # The fork sits on top of upstream main adding only its own two
          # workflow files, so this merge is expected to stay clean. If it
          # ever conflicts, fail here rather than resolving it unattended:
          # a human should look at what upstream changed.
          git fetch https://github.com/pyca/cryptography.git main
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:main

      - name: Trigger riscv64 build for latest new tag
        if: steps.diff.outputs.latest_new != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-riscv64.yml \
            --repo "${{ github.repository }}" \
            -f release_tag="${{ steps.diff.outputs.latest_new }}"
